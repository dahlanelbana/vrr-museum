
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VR Museum 3D</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .info {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 10;
      padding: 12px 18px;
      background: rgba(20, 20, 20, 0.65);
      color: white;
      border-radius: 8px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="info">
    🖱️ Mouse: Lihat sekeliling |
    ⌨️ WASD: Bergerak
  </div>

  <a-scene
    background="color: #b8c5d1"
    fog="type: exponential; color: #b8c5d1; density: 0.008"
    renderer="colorManagement: true; physicallyCorrectLights: true">

    <!-- MATERIAL DAN ASET -->

    <a-assets>

      <a-mixin
        id="marble"
        material="color: #aaa6a0; roughness: 0.22; metalness: 0.08">
      </a-mixin>

      <a-mixin
        id="wall"
        material="color: #635e57; roughness: 0.65">
      </a-mixin>

      <a-mixin
        id="gold"
        material="color: #b18a52; metalness: 0.8; roughness: 0.25">
      </a-mixin>

    </a-assets>


    <!-- PENCAHAYAAN -->

    <a-entity
      light="type: ambient; color: #fff0dc; intensity: 1.5">
    </a-entity>

    <a-entity
      light="type: directional; color: #fff2d6; intensity: 2"
      position="-5 10 4"
      rotation="-45 -30 0">
    </a-entity>

    <a-entity
      light="type: point; color: #ffd6a0; intensity: 5; distance: 18"
      position="0 6 0">
    </a-entity>

    <a-entity
      light="type: point; color: #ffdfb0; intensity: 3; distance: 12"
      position="-6 4 -5">
    </a-entity>

    <a-entity
      light="type: point; color: #ffdfb0; intensity: 3; distance: 12"
      position="6 4 -5">
    </a-entity>


    <!-- LANTAI MARمر -->

    <a-plane
      rotation="-90 0 0"
      width="30"
      height="30"
      material="color: #77736e; roughness: 0.2; metalness: 0.15">
    </a-plane>

    <!-- POLA LANTAI -->

    <a-ring
      position="0 0.012 0"
      rotation="-90 0 0"
      radius-inner="4.8"
      radius-outer="5"
      material="color: #c7b08b; metalness: 0.5; roughness: 0.25">
    </a-ring>

    <a-ring
      position="0 0.014 0"
      rotation="-90 0 0"
      radius-inner="7.8"
      radius-outer="8"
      material="color: #c7b08b; metalness: 0.5; roughness: 0.25">
    </a-ring>


    <!-- DINDING BELAKANG -->

    <a-box
      position="0 3 -9"
      width="20"
      height="6"
      depth="0.4"
      mixin="wall">
    </a-box>

    <!-- DINDING SAMPING -->

    <a-box
      position="-10 3 0"
      width="0.4"
      height="6"
      depth="18"
      mixin="wall">
    </a-box>

    <a-box
      position="10 3 0"
      width="0.4"
      height="6"
      depth="18"
      mixin="wall">
    </a-box>


    <!-- TIANG MUSEUM -->

    <a-cylinder
      position="-7 3 -6"
      radius="0.55"
      height="6"
      mixin="marble">
    </a-cylinder>

    <a-cylinder
      position="7 3 -6"
      radius="0.55"
      height="6"
      mixin="marble">
    </a-cylinder>

    <a-cylinder
      position="-7 3 5"
      radius="0.55"
      height="6"
      mixin="marble">
    </a-cylinder>

    <a-cylinder
      position="7 3 5"
      radius="0.55"
      height="6"
      mixin="marble">
    </a-cylinder>


    <!-- KUBAH SEDERHANA -->

    <a-cylinder
      position="0 6 -1"
      radius="6"
      height="0.3"
      material="color: #c9c0b3; roughness: 0.4">
    </a-cylinder>

    <a-ring
      position="0 6 -1"
      rotation="90 0 0"
      radius-inner="4"
      radius-outer="6"
      material="color: #a59a8d; roughness: 0.4">
    </a-ring>


    <!-- PATUNG TENGAH MUSEUM -->

    <!-- Alas patung -->

    <a-cylinder
      position="0 0.65 -1"
      radius="2"
      height="1.3"
      material="color: #b6aaa0; roughness: 0.3">
    </a-cylinder>

    <a-cylinder
      position="0 1.35 -1"
      radius="1.55"
      height="0.15"
      material="color: #ded3c5; roughness: 0.25">
    </a-cylinder>

    <!-- Tubuh patung -->

    <a-cylinder
      position="0 2.4 -1"
      radius="0.55"
      height="1.8"
      material="color: #d7d0c6; roughness: 0.65">
    </a-cylinder>

    <!-- Kepala -->

    <a-sphere
      position="0 3.55 -1"
      radius="0.4"
      material="color: #d7d0c6; roughness: 0.65">
    </a-sphere>

    <!-- Lengan -->

    <a-cylinder
      position="-0.65 2.75 -1"
      radius="0.16"
      height="1.3"
      rotation="0 0 -35"
      material="color: #d7d0c6; roughness: 0.65">
    </a-cylinder>

    <a-cylinder
      position="0.65 2.75 -1"
      radius="0.16"
      height="1.3"
      rotation="0 0 35"
      material="color: #d7d0c6; roughness: 0.65">
    </a-cylinder>


    <!-- PEMBATAS PATUNG -->

    <a-torus
      position="0 1.3 -1"
      rotation="90 0 0"
      radius="2.3"
      radius-tubular="0.035"
      material="color: #b18a52; metalness: 0.8">
    </a-torus>


    <!-- DISPLAY KIRI -->

    <a-box
      position="-5 1.2 -4.5"
      width="2.4"
      height="2.4"
      depth="1.6"
      material="color: #75685a; roughness: 0.4">
    </a-box>

    <!-- Kaca display -->

    <a-box
      position="-5 2.55 -4.5"
      width="2.3"
      height="1.1"
      depth="1.5"
      material="color: #b7d5df; transparent: true; opacity: 0.25; roughness: 0.05; metalness: 0.1">
    </a-box>

    <!-- Artefak -->

    <a-cylinder
      position="-5 2.6 -4.5"
      radius="0.35"
      height="0.6"
      material="color: #8d6747; roughness: 0.6">
    </a-cylinder>


    <!-- DISPLAY KANAN -->

    <a-box
      position="5 1.2 -4.5"
      width="2.4"
      height="2.4"
      depth="1.6"
      material="color: #75685a; roughness: 0.4">
    </a-box>

    <a-box
      position="5 2.55 -4.5"
      width="2.3"
      height="1.1"
      depth="1.5"
      material="color: #b7d5df; transparent: true; opacity: 0.25; roughness: 0.05; metalness: 0.1">
    </a-box>

    <!-- Objek display -->

    <a-sphere
      position="5 2.65 -4.5"
      radius="0.4"
      material="color: #476c93; roughness: 0.4">
    </a-sphere>


    <!-- PANEL RELIEF DINDING -->

    <a-box
      position="-7.5 3 -8.7"
      width="3.5"
      height="3.4"
      depth="0.15"
      material="color: #8e8173; roughness: 0.7">
    </a-box>

    <a-box
      position="7.5 3 -8.7"
      width="3.5"
      height="3.4"
      depth="0.15"
      material="color: #8e8173; roughness: 0.7">
    </a-box>


    <!-- TANAMAN -->

    <a-cylinder
      position="-8 0.7 -3"
      radius="0.65"
      height="1.4"
      material="color: #5c5045; roughness: 0.7">
    </a-cylinder>

    <a-sphere
      position="-8 2 -3"
      radius="1"
      material="color: #355c3a; roughness: 0.9">
    </a-sphere>

    <a-cylinder
      position="8 0.7 -3"
      radius="0.65"
      height="1.4"
      material="color: #5c5045; roughness: 0.7">
    </a-cylinder>

    <a-sphere
      position="8 2 -3"
      radius="1"
      material="color: #355c3a; roughness: 0.9">
    </a-sphere>


    <!-- BENCH -->

    <a-box
      position="-6 0.8 3"
      width="3"
      height="0.3"
      depth="0.9"
      material="color: #40332b; roughness: 0.4">
    </a-box>

    <a-box
      position="-7.2 0.4 3"
      width="0.2"
      height="0.8"
      depth="0.7"
      material="color: #40332b">
    </a-box>

    <a-box
      position="-4.8 0.4 3"
      width="0.2"
      height="0.8"
      depth="0.7"
      material="color: #40332b">
    </a-box>


    <!-- PINTU MASUK -->

    <a-box
      position="0 3 8.8"
      width="5"
      height="6"
      depth="0.3"
      material="color: #403b35; roughness: 0.5">
    </a-box>

    <a-box
      position="0 2.7 8.6"
      width="2.6"
      height="5.4"
      depth="0.15"
      material="color: #161b21; metalness: 0.3; roughness: 0.25">
    </a-box>


    <!-- KAMERA DAN KONTROL -->

    <a-entity
      position="0 1.6 6">

      <a-camera
        look-controls
        wasd-controls="acceleration: 18">

        <a-cursor
          color="#ffffff"
          fuse="false">
        </a-cursor>

      </a-camera>

    </a-entity>

  </a-scene>

</body>
</html>
